# Starship - Clean Two-Line Prompt

format = """
$directory $git_branch$git_status
$character"""

add_newline = true

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold cyan"
read_only = " RO"
read_only_style = "bold red"
truncation_length = 4
truncate_to_repo = true

[git_branch]
format = "on [$branch]($style)"
style = "bold purple"
symbol = ""

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "bold yellow"
conflicted = "!"
ahead = "+"
behind = "-"
diverged = "+-"
untracked = "?"
stashed = "*"
modified = "~"
staged = ">"
renamed = "r"
deleted = "x"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"

# Only show when relevant
[username]
format = "[$user]($style) "
style_user = "bold"
style_root = "bold red"
show_always = false

[hostname]
format = "[@$hostname]($style) "
style = "bold"
ssh_only = true

