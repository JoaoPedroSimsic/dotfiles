# Look and Feel - Retro Orange Monochrome TUI Style

# Colors
$orange = rgb(ff6600)
$orange_dim = rgb(4a2800)
$orange_bg = rgb(1a0a00)
$black = rgb(0d0500)

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = $orange
    col.inactive_border = $orange_dim
    layout = master
    resize_on_border = true
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }

    dim_inactive = true
    dim_strength = 0.1
}

animations {
    enabled = true

    bezier = snap, 0.0, 0.0, 0.2, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 2, snap
    animation = windowsOut, 1, 2, snap, popin 80%
    animation = border, 1, 2, snap
    animation = borderangle, 1, 50, linear, loop
    animation = fade, 1, 2, snap
    animation = workspaces, 1, 2, snap, slidevert
}

master {
    new_status = slave
    mfact = 0.55
    no_gaps_when_only = 1
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2
}
