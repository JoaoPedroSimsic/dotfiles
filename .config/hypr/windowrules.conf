# Window Rules

# Border colors based on focus
windowrulev2 = bordercolor rgb(ff6600), focus:1
windowrulev2 = bordercolor rgb(4a2800), focus:0

# Float certain windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(thunar)$, title:^(Confirm)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Volume Control)$

# Center floating windows
windowrulev2 = center, floating:1

# Picture-in-picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-490 100%-280, title:^(Picture-in-Picture)$

# Firefox
windowrulev2 = float, class:^(firefox)$, title:^(Library)$

# Scratchpad rules
windowrulev2 = float, class:^(scratchpad)$
windowrulev2 = size 80% 80%, class:^(scratchpad)$
windowrulev2 = center, class:^(scratchpad)$

# Wofi
windowrulev2 = stayfocused, class:^(wofi)$
windowrulev2 = animation slide, class:^(wofi)$

# Layer rules for better performance
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
